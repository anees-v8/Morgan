            background: rgba(255, 255, 255, 0.12);

            height: 8px;
            border-radius: 50%;

            cursor: grab;
            z-index: 10;

            cursor: grabbing;

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;

            stroke-width: 2.5;
            transition: stroke 0.3s, stroke-width 0.3s;
            opacity: 0.65;
        }

            stroke-width: 4;
            opacity: 1;
            filter: drop-shadow(0 0 6px currentColor);
        }

            transition: transform 0.2s ease-out;

            filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.35));

            ry: 14;

            font-size: 14px;

            right: 24px;

        const svg = document.getElementById('mindmap-svg');
        const canvasGroup = document.getElementById('canvas-group');
        const edgesLayer = document.getElementById('edges-layer');
        const nodesLayer = document.getElementById('nodes-layer');

        let zoomLevel = 0.95;
        let panX = window.innerWidth / 2;
        let panY = window.innerHeight / 2;
        let isDragging = false;
        let startX, startY;

        function computeLayout(root) {
            root.x = 0;
            root.y = 0;
            root.width = 240;
            root.height = 70;

            const mainBranches = root.children;
            const branchAngleStep = (2 * Math.PI) / mainBranches.length;
            const branchDist = 340;

            mainBranches.forEach((b, i) => {
                const angle = i * branchAngleStep - Math.PI / 2;
                b.x = Math.cos(angle) * branchDist;
                b.y = Math.sin(angle) * branchDist;
                b.width = 220;
                b.height = 64;

                if (b.children) {
                    const subAngleSpread = 0.55;
                    const subDist = 260;
                    const count = b.children.length;
                    b.children.forEach((sub, j) => {
                        const subAngle = angle + (j - (count - 1) / 2) * subAngleSpread;
                        sub.x = b.x + Math.cos(subAngle) * subDist;
                        sub.y = b.y + Math.sin(subAngle) * subDist;
                        sub.width = 200;
                        sub.height = 58;
                    });
                }
            });
        }

        computeLayout(mindmapData);

        function renderMindmap() {
            edgesLayer.innerHTML = '';
            nodesLayer.innerHTML = '';

            function drawSubtree(parent) {
                if (!parent.children) return;

                parent.children.forEach(child => {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const dx = child.x - parent.x;
                    const dy = child.y - parent.y;
                    const cx1 = parent.x + dx * 0.5;
                    const cy1 = parent.y;
                    const cx2 = parent.x + dx * 0.5;
                    const cy2 = child.y;

                    const d = `M ${parent.x} ${parent.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${child.x} ${child.y}`;
                    path.setAttribute('d', d);
                    path.setAttribute('class', 'edge');
                    path.setAttribute('stroke', child.color || '#a855f7');
                    path.setAttribute('id', `edge-${child.id}`);
                    edgesLayer.appendChild(path);

                    drawSubtree(child);
                });
            }

            drawSubtree(mindmapData);

            function drawNodes(node) {
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('class', 'node-group');
                g.setAttribute('id', `node-${node.id}`);
                g.setAttribute('transform', `translate(${node.x}, ${node.y})`);

                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', -node.width / 2);
                rect.setAttribute('y', -node.height / 2);
                rect.setAttribute('width', node.width);
                rect.setAttribute('height', node.height);
                rect.setAttribute('class', 'node-rect');
                rect.setAttribute('fill', node.category === 'root' ? 'rgba(30, 41, 59, 0.95)' : 'rgba(15, 23, 42, 0.88)');
                rect.setAttribute('stroke', node.color || '#00f0ff');
                g.appendChild(rect);

                const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                dot.setAttribute('cx', -node.width / 2 + 18);
                dot.setAttribute('cy', -node.height / 2 + 20);
                dot.setAttribute('r', 4);
                dot.setAttribute('fill', node.color || '#00f0ff');
                g.appendChild(dot);

                const textTitle = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                textTitle.setAttribute('x', -node.width / 2 + 30);
                textTitle.setAttribute('y', -node.height / 2 + 24);
                textTitle.setAttribute('class', 'node-text-title');
                textTitle.textContent = node.title;
                g.appendChild(textTitle);

                const textSub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                textSub.setAttribute('x', -node.width / 2 + 30);
                textSub.setAttribute('y', -node.height / 2 + 42);
                textSub.setAttribute('class', 'node-text-subtitle');
                textSub.textContent = node.subtitle;
                g.appendChild(textSub);

                g.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openDrawer(node);
                    highlightBranch(node);
                });

                nodesLayer.appendChild(g);

                if (node.children) {
                    node.children.forEach(c => drawNodes(c));
                }
            }

            drawNodes(mindmapData);
            updateTransform();
        }

        function updateTransform() {
            canvasGroup.setAttribute('transform', `translate(${panX}, ${panY}) scale(${zoomLevel})`);
        }

        const viewport = document.getElementById('viewport');

        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.node-group')) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            const newZoom = Math.min(Math.max(zoomLevel * zoomFactor, 0.4), 2.5);

            const mouseX = e.clientX - panX;
            const mouseY = e.clientY - panY;
            panX -= mouseX * (newZoom / zoomLevel - 1);
            panY -= mouseY * (newZoom / zoomLevel - 1);

            zoomLevel = newZoom;
            updateTransform();
        });

        document.getElementById('zoomInBtn').onclick = () => { zoomLevel = Math.min(zoomLevel * 1.2, 2.5); updateTransform(); };
        document.getElementById('zoomOutBtn').onclick = () => { zoomLevel = Math.max(zoomLevel / 1.2, 0.4); updateTransform(); };
        document.getElementById('zoomResetBtn').onclick = () => {
            zoomLevel = 0.95;
            panX = window.innerWidth / 2;
            panY = window.innerHeight / 2;
            updateTransform();
        };

        const sideDrawer = document.getElementById('sideDrawer');
        const drawerTitle = document.getElementById('drawerTitle');
        const drawerTag = document.getElementById('drawerTag');
        const drawerContent = document.getElementById('drawerContent');
        const drawerClose = document.getElementById('drawerClose');

        function openDrawer(node) {
            drawerTag.textContent = (node.category || 'INFO').toUpperCase();
            drawerTag.style.background = `${node.color}22`;
            drawerTag.style.color = node.color;
            drawerTag.style.border = `1px solid ${node.color}44`;

            drawerTitle.textContent = node.title;

            let html = `<p style="font-size:15px; color:#f1f5f9; margin-bottom:18px;"><strong>${node.summary}</strong></p>`;
            
            if (node.details.overview) {
                html += `<h3>Strategic Blueprint</h3><p>${node.details.overview}</p>`;
            }

            if (node.details.stats) {
                html += '<div class="stat-card-row">';
                node.details.stats.forEach(s => {
                    html += `<div class="stat-card"><div class="val">${s.val}</div><div class="lbl">${s.lbl}</div></div>`;
                });
                html += '</div>';
            }

            if (node.details.bulletPoints) {
                html += '<h3>Operational Execution</h3><ul>';
                node.details.bulletPoints.forEach(bp => {
                    html += `<li>${bp}</li>`;
                });
                html += '</ul>';
            }

            if (node.details.code) {
                html += `<h3>Architecture Spec</h3><pre class="code-box"><code>${node.details.code}</code></pre>`;
            }

            drawerContent.innerHTML = html;
            sideDrawer.classList.add('open');
        }

        drawerClose.onclick = () => { sideDrawer.classList.remove('open'); };

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;

                document.querySelectorAll('.node-group').forEach(g => {
                    const id = g.id.replace('node-', '');
                    if (filter === 'all' || id === 'root' || id.startsWith(filter)) {
                        g.style.opacity = '1';
                        g.style.pointerEvents = 'auto';
                    } else {
                        g.style.opacity = '0.15';
                        g.style.pointerEvents = 'none';
                    }
                });

                document.querySelectorAll('.edge').forEach(e => {
                    const id = e.id.replace('edge-', '');
                    if (filter === 'all' || id.startsWith(filter)) {
                        e.style.opacity = '0.65';
                    } else {
                        e.style.opacity = '0.08';
                    }
                });
            };
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                document.querySelectorAll('.node-group').forEach(g => g.style.opacity = '1');
                document.querySelectorAll('.edge').forEach(e => e.style.opacity = '0.65');
                return;
            }

            document.querySelectorAll('.node-group').forEach(g => {
                const text = g.textContent.toLowerCase();
                if (text.includes(query)) {
                    g.style.opacity = '1';
                    g.querySelector('.node-rect').setAttribute('stroke', '#00f0ff');
                    g.querySelector('.node-rect').setAttribute('stroke-width', '3');
                } else {
                    g.style.opacity = '0.2';
                    g.querySelector('.node-rect').setAttribute('stroke-width', '1.5');
                }
            });
        });

        function highlightBranch(node) {
            document.querySelectorAll('.edge').forEach(e => e.classList.remove('highlighted'));
            const edge = document.getElementById(`edge-${node.id}`);
            if (edge) edge.classList.add('highlighted');
        }

        renderMindmap();
    </script>
