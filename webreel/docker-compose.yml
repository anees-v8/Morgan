version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
    volumes:
      - ./output:/app/output

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - APP_ENV=production
    volumes:
      - ./output:/app/output
